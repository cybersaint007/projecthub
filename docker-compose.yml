services:
  projecthub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projecthub
    restart: unless-stopped
    network_mode: host
    environment:
      - APP_ENV=production
    volumes:
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080"]
      interval: 30s
      timeout: 10s
      retries: 3

  projecthub-queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projecthub-queue
    restart: unless-stopped
    network_mode: host
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=production
    volumes:
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    # Worker container does not serve HTTP; disable the base image's web healthcheck.
    healthcheck:
      disable: true
    depends_on:
      - projecthub

  projecthub-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projecthub-scheduler
    restart: unless-stopped
    network_mode: host
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    environment:
      - APP_ENV=production
    volumes:
      - app-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    # Scheduler container does not serve HTTP; disable the base image's web healthcheck.
    healthcheck:
      disable: true
    depends_on:
      - projecthub

volumes:
  app-storage:
