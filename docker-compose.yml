services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projecthub
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - projecthub-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projecthub-queue
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
    command: php artisan queue:work --sleep=3 --tries=3
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "default"]
      interval: 60s
      timeout: 10s
      retries: 3
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - projecthub-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projecthub-scheduler
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:run' || pgrep -f 'sleep'"]
      interval: 60s
      timeout: 10s
      retries: 3
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - projecthub-network

volumes:
  app-storage:

networks:
  projecthub-network:
    driver: bridge
