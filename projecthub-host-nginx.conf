# ProjectHub — HOST reverse-proxy vhost (TLS termination)
#
# This is the *host* nginx site config that terminates TLS for
# https://projecthub.fincosoft.com and proxies to the container's nginx,
# which listens on 127.0.0.1:18080 (docker-compose uses network_mode: host).
#
# NOT to be confused with `projecthub-nginx.conf`, which is the nginx config
# baked *inside* the container (php-fpm/Laravel public root on :18080).
#
# ── Install ──────────────────────────────────────────────────────────────────
#   sudo cp projecthub-host-nginx.conf /etc/nginx/sites-available/projecthub
#   sudo ln -sfn /etc/nginx/sites-available/projecthub /etc/nginx/sites-enabled/projecthub
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── Enable HTTPS (Let's Encrypt) ─────────────────────────────────────────────
# Run certbot once; it appends the `listen 443 ssl` block, the ssl_certificate
# lines, and an automatic :80 -> :443 redirect, and sets up auto-renewal:
#
#   sudo certbot --nginx -d projecthub.fincosoft.com \
#       --non-interactive --agree-tos -m imcybersaint@gmail.com --redirect
#
# DNS for projecthub.fincosoft.com must already point at this host before
# running certbot (HTTP-01 challenge needs port 80 reachable on the domain).

server {
    listen 80;
    listen [::]:80;
    server_name projecthub.fincosoft.com;

    # Allow large uploads (project file attachments)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
